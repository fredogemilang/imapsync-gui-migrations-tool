<script>
  document.addEventListener('DOMContentLoaded', () => {
    const path = window.location.pathname;
    const navLinks = document.querySelectorAll('[data-purpose="bottom-nav"] a');
    
    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      const filename = path.substring(path.lastIndexOf('/') + 1) || 'index.html';
      
      const isBulkPage = filename.startsWith('bulk-migrations');
      const isSettingsPage = filename === 'settings.html';
      const isMigrationsPage = !isBulkPage && !isSettingsPage && (
        filename === 'migrations.html' || 
        filename === 'your-migration.html' || 
        filename === 'migrations-step2.html' || 
        filename === 'migrations-step3.html'
      );
      
      const isMatch = href && (
        (href === 'migrations.html' && isMigrationsPage) ||
        (href === 'bulk-migrations.html' && isBulkPage) ||
        (href === 'settings.html' && isSettingsPage) ||
        (href === 'overview.html' && !isMigrationsPage && !isBulkPage && !isSettingsPage && (filename === 'overview.html' || filename === 'index.html'))
      );

      if (isMatch) {
        link.classList.remove('text-primary');
        link.classList.add('text-blue-500');
        const iconContainer = link.querySelector('div');
        if (iconContainer) {
          iconContainer.classList.remove('group-hover:bg-slate-50');
          iconContainer.classList.add('bg-blue-50');
        }
        const spanText = link.querySelector('span');
        if (spanText) {
          spanText.classList.remove('font-medium');
          spanText.classList.add('font-semibold');
        }
      } else {
        link.classList.remove('text-blue-500');
        link.classList.add('text-primary');
        const iconContainer = link.querySelector('div');
        if (iconContainer) {
          iconContainer.classList.remove('bg-blue-50');
          iconContainer.classList.add('group-hover:bg-slate-50');
        }
        const spanText = link.querySelector('span');
        if (spanText) {
          spanText.classList.remove('font-semibold');
          spanText.classList.add('font-medium');
        }
      }
    });
  });
</script>
