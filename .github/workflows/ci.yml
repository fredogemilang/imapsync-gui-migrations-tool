name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version:` — action-setup@v4 reads the version from the root
        # package.json's `packageManager` field. Specifying both was the
        # ERR_PNPM_BAD_PM_VERSION error on the first push.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Format check
        run: pnpm format:check

      - name: Crypto modules in sync
        run: pnpm check:crypto-sync

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          # Test envs — required by env.ts schemas, never touch real services
          MASTER_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          JWT_SECRET: 'test-secret-at-least-16-chars-long'
        run: pnpm test
