<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>{{title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <script>
    (function () {
      const mode = localStorage.getItem('theme-mode') || 'system';
      if (mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>
<body class="text-slate-800 fixed inset-0 w-full flex flex-col overflow-hidden font-sans">
  {{> @partial-block }}
  
  <script>
    function toggleProfileDropdown(event) {
      event.stopPropagation();
      const menu = document.getElementById('profile-dropdown-menu');
      if (!menu) return;
      const isHidden = menu.classList.contains('hidden');
      
      // Close other dropdowns if any
      document.querySelectorAll('.custom-dropdown-panel').forEach(p => p.classList.add('hidden'));
      
      if (isHidden) {
        menu.classList.remove('hidden');
      } else {
        menu.classList.add('hidden');
      }
    }

    function setThemeMode(mode) {
      localStorage.setItem('theme-mode', mode);
      
      if (mode === 'dark') {
        document.documentElement.classList.add('dark');
      } else if (mode === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        // System preference
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }

      const lightBtns = document.querySelectorAll('.theme-btn-light');
      const darkBtns = document.querySelectorAll('.theme-btn-dark');
      const systemBtns = document.querySelectorAll('.theme-btn-system');

      function resetBtn(btn) {
        if (!btn) return;
        btn.classList.remove('bg-slate-100', 'text-blue-600', 'hover:bg-slate-200/60', 'bg-slate-800', 'text-blue-400', 'hover:bg-slate-700/60');
        btn.classList.add('text-slate-400', 'hover:bg-slate-100', 'hover:text-slate-600', 'dark:hover:bg-slate-800', 'dark:hover:text-slate-200');
      }

      function setBtnActive(btn) {
        if (!btn) return;
        btn.classList.remove('text-slate-400', 'hover:bg-slate-100', 'hover:text-slate-600', 'dark:hover:bg-slate-800', 'dark:hover:text-slate-200');
        btn.classList.add('bg-slate-100', 'text-blue-600', 'hover:bg-slate-200/60', 'dark:bg-slate-800', 'dark:text-blue-400', 'dark:hover:bg-slate-700/60');
      }

      lightBtns.forEach(resetBtn);
      darkBtns.forEach(resetBtn);
      systemBtns.forEach(resetBtn);

      if (mode === 'light') {
        lightBtns.forEach(setBtnActive);
      } else if (mode === 'dark') {
        darkBtns.forEach(setBtnActive);
      } else if (mode === 'system') {
        systemBtns.forEach(setBtnActive);
      }
    }

    // Apply active theme state on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', () => {
      const savedMode = localStorage.getItem('theme-mode') || 'system';
      setThemeMode(savedMode);
    });

    function toggleNotificationsDropdown(event) {
      event.stopPropagation();
      const menu = document.getElementById('notifications-dropdown-menu');
      if (!menu) return;
      const isHidden = menu.classList.contains('hidden');
      
      // Close other dropdowns if any
      document.querySelectorAll('.custom-dropdown-panel').forEach(p => p.classList.add('hidden'));
      const profileMenu = document.getElementById('profile-dropdown-menu');
      if (profileMenu) profileMenu.classList.add('hidden');
      
      if (isHidden) {
        menu.classList.remove('hidden');
      } else {
        menu.classList.add('hidden');
      }
    }

    function markAllNotificationsAsRead(event) {
      if (event) event.stopPropagation();
      
      // Hide dots
      document.querySelectorAll('.notification-dot').forEach(dot => {
        dot.classList.add('hidden');
      });
      
      // Remove unread bg classes
      document.querySelectorAll('.notification-item').forEach(item => {
        item.classList.remove('unread');
      });
      
      // Clear/hide badges
      const badges = document.querySelectorAll('#notification-badge');
      badges.forEach(badge => {
        badge.classList.add('hidden');
      });
    }

    // Close profile and notification dropdowns on click outside
    document.addEventListener('click', (e) => {
      // Profile Dropdown
      const menu = document.getElementById('profile-dropdown-menu');
      const container = document.getElementById('profile-dropdown-container');
      if (menu && !menu.contains(e.target) && container && !container.contains(e.target)) {
        menu.classList.add('hidden');
      }
      
      // Notifications Dropdown
      const notifMenu = document.getElementById('notifications-dropdown-menu');
      const notifContainer = document.getElementById('notifications-container');
      if (notifMenu && !notifMenu.contains(e.target) && notifContainer && !notifContainer.contains(e.target)) {
        notifMenu.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
