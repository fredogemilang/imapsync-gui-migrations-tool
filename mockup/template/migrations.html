{{#> layouts/base title="Migrations - Email Migration Dashboard"}}

{{> header-step step="1 / 3" prevUrl="overview.html" nextUrl="migrations-step2.html" }}

<!-- Main Layout container -->
<div class="flex flex-1 overflow-hidden pb-[88px]">

  {{> sidebar-step stepTitle="Step 01" showMailIcon=false }}

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col relative overflow-hidden" data-purpose="main-content">

    <!-- Scrollable content -->
    <div id="scrollable-content" class="flex-1 overflow-y-auto mb-24 p-4 md:p-8 lg:p-10">

      {{> migrations-content }}

    </div>

    <!-- Bottom actions footer -->
    <div class="absolute bottom-0 inset-x-0 bg-white/80 backdrop-blur-md border-t border-slate-200/60 pt-4 pb-6 flex flex-col items-center z-10 px-4 md:px-10">
      <button onclick="startCheckSettings()" class="w-full max-w-4xl bg-primary-container hover:bg-primary-dark text-white rounded-lg py-3.5 flex items-center justify-center font-bold text-[15px] shadow-md hover:shadow-lg transition-all duration-200 group cursor-pointer">
        <div class="w-full flex items-center px-4 relative">
          <!-- Checkmark SVG -->
          <svg class="h-5 w-5 absolute left-4 group-hover:scale-110 transition-transform text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="flex-1 text-center font-bold">Check Settings</span>
        </div>
      </button>
      <button onclick="resetStepData()" class="mt-3 text-slate-400 hover:text-primary text-xs font-bold transition-colors cursor-pointer select-none">
        Reset Data
      </button>
    </div>

  </main>

</div>

{{> bottom-nav }}

{{/layouts/base}}
