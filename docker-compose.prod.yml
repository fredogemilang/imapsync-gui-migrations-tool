services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    # Healthcheck verifies the server is listening AFTER the entrypoint's
    # `drizzle-kit push --force` finishes — so dependents (worker) wait
    # for schema to be up-to-date before they start hitting the DB.
    # Hits the no-auth /api/health endpoint and FAILS if it can't reach
    # (different from the previous `|| true; exit 0` which always passed).
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider --tries=1 http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Domain + TLS routing is configured via Dokploy's Domain UI per
    # service (see DEPLOY.md "Configure domains in Dokploy"). No Traefik
    # labels needed in this compose file — Dokploy injects them based on
    # what you set in the UI.

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: prod
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    deploy:
      replicas: 2
    volumes:
      - imapsync-state:/var/lib/imapsync
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # Wait for api so schema push completes before worker starts
      # writing to (potentially missing) columns.
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        # Empty = same-origin (recommended): browser calls /api/* on the
        # same domain it loaded from. Dokploy's domain UI routes /api
        # to the api service. Override only for split-domain deploys
        # (web on app.example.com, api on api.example.com) — set the
        # api's full origin here.
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: always
    # Domain routing is set in Dokploy's Domain UI (see DEPLOY.md).

volumes:
  pgdata:
  redisdata:
  imapsync-state:
