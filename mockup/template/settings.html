{{#> layouts/base title="Settings - Email Migration Dashboard"}}

<!-- Main Layout container -->
<div class="flex flex-1 overflow-hidden pb-[88px]">

  {{> sidebar-step stepTitle="Settings" showGearIcon=true }}

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col relative overflow-hidden" data-purpose="main-content">

    <!-- Scrollable content -->
    <div id="scrollable-content" class="flex-1 overflow-y-auto p-4 md:p-8 lg:p-10 transition-all duration-500">

      {{> settings-content }}

    </div>

  </main>

</div>

{{> bottom-nav }}

{{/layouts/base}}
