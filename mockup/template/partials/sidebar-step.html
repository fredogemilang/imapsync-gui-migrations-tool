<!-- Left Sidebar (Step Indicator) -->
<aside
  class="border-r border-slate-200/60 bg-white/40 backdrop-blur-sm flex flex-col relative hidden md:flex w-64 lg:w-80"
  data-purpose="left-sidebar-step">
  <!-- Step Title -->
  <div class="p-8 flex-1 flex flex-col justify-center">
    <h2 class="text-3xl font-bold text-[#202B8C] leading-tight mt-20">{{#if stepTitle}}{{stepTitle}}{{else}}Step 01{{/if}}</h2>
  </div>

  <!-- Faded Icon at bottom -->
  <div class="absolute bottom-10 left-10 opacity-[0.06] pointer-events-none text-primary-dark">
    {{#if showMailIcon}}
    <svg fill="none" height="180" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
      viewBox="0 0 24 24" width="180">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
      <polyline points="22,6 12,13 2,6"></polyline>
    </svg>
    {{else if showGearIcon}}
    <svg fill="none" height="180" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
      viewBox="0 0 24 24" width="180">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
    {{else}}
    <svg fill="none" height="180" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
      viewBox="0 0 24 24" width="180">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    {{/if}}
  </div>
</aside>
