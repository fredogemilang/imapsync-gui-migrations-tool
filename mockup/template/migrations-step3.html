{{#> layouts/base title="Migrations Step 3 - Email Migration Dashboard"}}

{{> header-step step="3 / 3" prevUrl="migrations-step2.html" nextUrl="#" }}

<!-- Main Layout container -->
<div class="flex flex-1 overflow-hidden pb-[88px]">

  {{> sidebar-step stepTitle="Step 03" showMailIcon=true }}

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col relative overflow-hidden" data-purpose="main-content">

    <!-- Scrollable content -->
    <div id="scrollable-content" class="flex-1 overflow-y-auto p-4 md:p-8 lg:p-10 transition-all duration-500">

      {{> migrations-step3-content }}

    </div>

    <!-- Sticky footer action, shown when finished -->
    <div id="footer-action-completed" class="hidden opacity-0 transition-opacity duration-500">
      {{> footer-action }}
    </div>

  </main>

</div>

{{> bottom-nav }}

{{/layouts/base}}
