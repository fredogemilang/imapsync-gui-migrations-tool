{{#> layouts/base title="Migrations Step 2 - Email Migration Dashboard"}}

{{> header-step step="2 / 3" prevUrl="migrations.html" nextUrl="#" }}

<!-- Main Layout container -->
<div class="flex flex-1 overflow-hidden pb-[88px]">

  {{> sidebar-step stepTitle="Step 02" showMailIcon=true }}

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col relative overflow-hidden" data-purpose="main-content">

    <!-- Scrollable content -->
    <div id="scrollable-content" class="flex-1 overflow-y-auto mb-24 p-4 md:p-8 lg:p-10">

      {{> migrations-step2-content }}

    </div>

    <!-- Bottom actions footer -->
    <div class="absolute bottom-0 inset-x-0 bg-white/80 backdrop-blur-md border-t border-slate-200/60 pt-4 pb-6 flex flex-col items-center z-10 px-4 md:px-10">
      <button onclick="startMigration()" class="w-full max-w-4xl bg-primary-container hover:bg-primary-dark text-white rounded-lg py-3.5 flex items-center justify-center font-bold text-[15px] shadow-md hover:shadow-lg transition-all duration-200 group cursor-pointer">
        <div class="w-full flex items-center px-4 relative">
          <!-- Play/Start icon inside wrapper -->
          <span class="absolute left-4 bg-white/25 rounded-full p-1 flex items-center justify-center group-hover:scale-105 transition-transform">
            <svg class="h-4.5 w-4.5 fill-white stroke-none" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
          </span>
          <span class="flex-1 text-center font-bold">Start Your Migration</span>
        </div>
      </button>
    </div>

  </main>

</div>

{{> bottom-nav }}

{{/layouts/base}}
